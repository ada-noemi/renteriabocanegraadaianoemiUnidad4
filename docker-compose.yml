services:
  app:
    image: gestion-mantenimiento-u4:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mantenimiento-u4-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mantenimiento-network

  app2:
    image: gestion-mantenimiento-u4:1.0
    container_name: mantenimiento-u4-app2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mantenimiento-network

  mysql:
    image: mysql:8.4
    container_name: mantenimiento-u4-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mantenimiento-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    container_name: mantenimiento-u4-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - app2
    networks:
      - mantenimiento-network

networks:
  mantenimiento-network:
    driver: bridge

volumes:
  mysql-data: