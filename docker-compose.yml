services:
  app:
    image: gestion-mantenimiento-u4:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mantenimiento-u4-app
    restart: unless-stopped
    ports:
      - "8085:80"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mantenimiento-network

  mysql:
    image: mysql:8.4
    container_name: mantenimiento-u4-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mantenimiento-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  mantenimiento-network:
    driver: bridge

volumes:
  mysql-data: